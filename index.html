<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Drive — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#182339;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:420px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 12px 55px #24345220;position:relative;padding-bottom:86px}.top{background:#102f67;color:white;padding:22px 23px 24px;border-radius:0 0 26px 26px}.brand{font-weight:900;letter-spacing:-.7px;font-size:22px}.brand span{color:#70d5fa}.eyebrow{font-size:12px;opacity:.72;margin-top:14px}.heading{font-size:24px;font-weight:800;margin:4px 0 0}.sub{font-size:13px;color:#66768b}.top .sub{color:#b7cce7}.badge{display:inline-block;background:#e0f6ed;color:#176a4c;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:700}.card{background:white;border:1px solid #e3e8f0;border-radius:18px;padding:16px;box-shadow:0 3px 11px #18233908;margin:13px 19px}.section{margin:23px 20px 8px;font-weight:800;font-size:17px}.map{height:178px;background:linear-gradient(30deg,#e0e9e5 24%,#f5f1e6 24% 30%,#e0e9e5 30% 53%,#f5f1e6 53% 58%,#e0e9e5 58%);position:relative;overflow:hidden;border-radius:14px;margin-top:13px}.map:before,.map:after{content:"";position:absolute;background:#fff9;border:2px solid #fff;transform:rotate(-33deg)}.map:before{width:530px;height:23px;left:-70px;top:65px}.map:after{width:23px;height:350px;left:170px;top:-70px}.pin{position:absolute;z-index:2;background:#123c78;color:white;padding:7px;border-radius:12px;font-size:12px}.pin.a{top:33px;left:45px}.pin.b{right:33px;bottom:28px;background:#10a47c}.route{height:4px;width:190px;background:#14a6ef;position:absolute;top:99px;left:104px;transform:rotate(23deg);z-index:1}.content{padding:15px 20px}.field{display:block;font-size:12px;font-weight:700;color:#566477;margin:13px 0 7px}.entry{width:100%;border:1px solid #dbe3ec;border-radius:11px;padding:13px;background:#fbfcff;color:#122542;outline:none}.primary{width:100%;border:none;background:#1663c7;color:white;padding:14px;border-radius:12px;font-weight:800;margin-top:15px}.secondary{border:1px solid #d5dfec;background:white;color:#154b8b;padding:10px 13px;border-radius:11px;font-weight:700}.mini{font-size:12px;color:#69798c}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:420px;width:100%;height:73px;background:white;border-top:1px solid #e0e6ef;display:flex;justify-content:space-around;padding:9px 5px;z-index:9}.tab{border:none;background:transparent;color:#78889b;display:grid;justify-items:center;align-content:center;gap:4px;font-size:11px;min-width:65px}.tab.active{color:#1464c8;font-weight:800}.ico{font-size:23px}.trip{border:1px solid #e3e8f0;padding:14px;border-radius:14px;margin-top:12px}.avatar{width:42px;height:42px;border-radius:50%;background:#d8e9ff;display:grid;place-items:center;font-size:20px}.hidden{display:none}.chat{background:#edf3fb;border-radius:14px;padding:12px;margin:10px 0}.chat.mine{background:#d9edff;margin-left:30px}.chat:not(.mine){margin-right:30px}.toast{background:#e8f8ed;color:#176a4c;border-radius:11px;padding:12px;font-size:13px;margin:12px 0}.rating{color:#f5aa2c}.mode{border:1px solid #dbe3ef;border-radius:13px;padding:12px;display:flex;justify-content:space-between;align-items:center}.switch{accent-color:#176ac6;width:24px;height:24px}.center{text-align:center}.bubble{font-size:43px;margin:15px 0}
</style></head><body><div class="shell">
<div id="app"></div><nav class="tabs" id="tabs"></nav></div>
<script>
let screen="home",isDriver=false,online=false,requested=false,accepted=false,feed=[{name:"Mia",text:"Heading downtown. Anyone driving back to campus?",time:"9:42 PM"},{name:"Alex",text:"Available for rides near Hancock St 🚗",time:"9:44 PM"}], pickup="Downtown Milledgeville",dropoff="Georgia College Campus";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function go(s){screen=s;render()}function setDriver(v){isDriver=v;go("home")}
function request(){pickup=document.getElementById("from").value||pickup;dropoff=document.getElementById("to").value||dropoff;requested=true;go("rides")}
function post(){const el=document.getElementById("msg");if(!el.value.trim())return;feed.push({name:"You",text:el.value,time:"Just now"});render()}
function header(title,description){return '<div class="top"><div class="brand">COLLEGE <span>DRIVE</span> 🚙</div><div class="eyebrow">GEORGIA COLLEGE & STATE UNIVERSITY</div><div class="heading">'+title+'</div><div class="sub">'+description+'</div></div>'}
function map(){return '<div class="map"><div class="route"></div><span class="pin a">📍 Downtown</span><span class="pin b">🏫 Campus</span></div>'}
function home(){return header(isDriver?"Driver dashboard":"Your ride home, simplified.",isDriver?"Earn money giving students safe rides.":"Exclusively for verified college students.")+'<div class="content"><div class="line"><span class="badge">✓ Student verified</span><button class="secondary" onclick="setDriver(!isDriver)">Switch to '+(isDriver?"Rider":"Driver")+'</button></div>'+map()+(isDriver?'<div class="section" style="margin-left:0">Driver status</div><div class="mode">Available for rides <input class="switch" type="checkbox" '+(online?"checked":"")+' onchange="online=this.checked;render()"></div><p class="mini">Demo only — no real rides or payments.</p><div class="trip"><b>Nearby request</b><p>📍 Downtown → Georgia College</p><div class="line"><span>Est. fare <b>$7.50</b></span><button class="secondary" onclick="accepted=true;go(\'rides\')">Accept ride</button></div></div>':'<div class="section" style="margin-left:0">Where to?</div><label class="field">PICKUP LOCATION</label><input class="entry" id="from" value="'+esc(pickup)+'"><label class="field">DESTINATION</label><input class="entry" id="to" value="'+esc(dropoff)+'"><button class="primary" onclick="request()">Find a student driver →</button><p class="mini center">Demo price estimate: $7.50 · 6 min pickup</p>')+'</div>'}
function rides(){return header("My rides","Ride requests and trip details.")+'<div class="content">'+(accepted?'<div class="toast">✓ You accepted the sample ride.</div>':requested?'<div class="toast">✓ Demo ride requested! This is a simulated match.</div>':'<p class="sub">No active rides yet. Request a ride from Home.</p>')+(accepted||requested?'<div class="trip"><div class="line"><b>'+ (accepted?"Rider: Taylor":"Driver: Alex") +'</b><span class="rating">★ 4.9</span></div><p class="mini">Verified Georgia College student · Toyota Camry</p><p>📍 '+esc(pickup)+'</p><p>🏁 '+esc(dropoff)+'</p><div class="line"><strong>$7.50</strong><span class="badge">Demo trip</span></div><button class="primary" onclick="requested=false;accepted=false;go(\'home\')">Complete sample trip</button></div>':'<button class="primary" onclick="go(\'home\')">Find a ride</button>')+'</div>'}
function chat(){return header("Campus Ride Chat","Ask for a ride or offer a seat.")+'<div class="content"><span class="badge">🔒 Student-only community · Demo</span><p class="mini">Messages are sample data and stay in this browser session.</p>'+feed.map(m=>'<div class="chat '+(m.name==="You"?"mine":"")+'"><div class="line"><b>'+esc(m.name)+'</b><span class="mini">'+esc(m.time)+'</span></div><div style="margin-top:7px">'+esc(m.text)+'</div></div>').join("")+'<label class="field">YOUR MESSAGE</label><input id="msg" class="entry" placeholder="Anyone giving rides near downtown?" onkeydown="if(event.key===\'Enter\')post()"><button class="primary" onclick="post()">Post to student chat ↗</button></div>'}
function profile(){return header("My account","Your College Drive profile.")+'<div class="content center"><div class="bubble">🎓</div><h2>Georgia College Student</h2><span class="badge">✓ Verified student · Sample profile</span><div class="trip" style="text-align:left"><div class="line"><b>Student rating</b><span class="rating">★★★★★</span></div><p class="mini">4.9 stars · 18 sample trips</p><hr style="border:0;border-top:1px solid #eee"><p>🏫 Georgia College & State University</p><p>🚘 Rider and driver modes</p><p>🔐 School email verification (planned)</p></div><button class="secondary" onclick="setDriver(!isDriver)">Switch to '+(isDriver?"Rider":"Driver")+' mode</button></div>'}
function render(){document.getElementById("app").innerHTML=({home,rides,chat,profile}[screen]||home)();let ts=[["home","⌂","Home"],["rides","🚘","Rides"],["chat","💬","Ride Chat"],["profile","👤","Profile"]];document.getElementById("tabs").innerHTML=ts.map(([s,i,n])=>'<button class="tab '+(s===screen?"active":"")+'" onclick="go(\''+s+'\')"><span class="ico">'+i+'</span>'+n+'</button>').join("")}render();
</script></body></html>
